<div class="empty-state">
  <div class="empty-icon-wrapper">
    <!-- Ícone estetoscópio / busca médica vazia -->
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      <line x1="8" y1="11" x2="14" y2="11"/>
    </svg>
  </div>
  <h3 class="empty-title">Nenhuma vaga encontrada</h3>
  <p class="empty-description">
    Não encontramos vagas ativas para os filtros selecionados no momento.
    Tente usar termos mais amplos (como apenas "Técnico" ou "UTI") ou selecione outra cidade/instituição.
  </p>
  <button type="button"
          class="btn btn-secondary"
          hx-get="/jobs"
          hx-target="#jobs-container"
          hx-push-url="/"
          hx-disabled-elt="this"
          onclick="document.getElementById('search-form').reset();">
    <span>Limpar todos os filtros</span>
  </button>
</div>
