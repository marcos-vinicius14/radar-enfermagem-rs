name: CI API

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/api/**'
      - 'deployments/**'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.golangci.yml'
      - '.github/workflows/ci.yaml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'deployments/**'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.golangci.yml'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  lint-and-static-check:
    name: Lint & Análise Estática
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/api/go.mod'
          cache: true
          cache-dependency-path: 'apps/api/go.sum'

      - name: Verificar formatação (gofmt)
        run: |
          unformatted=$(gofmt -s -l apps/api)
          if [ -n "$unformatted" ]; then
            echo "::error::Arquivos fora do padrão gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Executar go vet
        working-directory: apps/api
        run: go vet ./...

      - name: Verificar integridade dos módulos (go mod tidy)
        working-directory: apps/api
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Instalar sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: '1.31.1'

      - name: Validar consistência do sqlc (sqlc diff)
        working-directory: apps/api
        run: sqlc diff

      - name: Executar golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: apps/api
          args: --timeout=5m

  unit-tests:
    name: Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/api/go.mod'
          cache: true
          cache-dependency-path: 'apps/api/go.sum'

      - name: Executar testes unitários com detecção de concorrência (-race -short)
        working-directory: apps/api
        run: go test -race -short -v -coverprofile=coverage-unit.out ./...

      - name: Executar testes E2E reais de extração (Live Smoke Tests)
        working-directory: apps/api
        run: go test -v -tags=e2e ./internal/collector/... -run TestSantaCasaCollector_LiveE2E

      - name: Relatório de cobertura dos testes unitários
        working-directory: apps/api
        run: go tool cover -func=coverage-unit.out

      - name: Upload do artefato de cobertura unitária
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: apps/api/coverage-unit.out
          retention-days: 7

  integration-tests:
    name: Testes de Integração (PostgreSQL 18)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radar_enfermagem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: radar_enfermagem_test
      DB_SSLMODE: disable
      DB_CONN_TIMEOUT: 5s

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/api/go.mod'
          cache: true
          cache-dependency-path: 'apps/api/go.sum'

      - name: Aguardar prontidão do PostgreSQL 18
        run: |
          for i in {1..30}; do
            if docker exec ${{ job.services.postgres.id }} pg_isready -U postgres -d radar_enfermagem_test; then
              echo "PostgreSQL 18 pronto para conexões!"
              exit 0
            fi
            echo "Aguardando PostgreSQL 18 iniciar..."
            sleep 1
          done
          echo "::error::Tempo esgotado aguardando inicialização do PostgreSQL 18"
          exit 1

      - name: Aplicar migrações (up)
        working-directory: apps/api
        run: go run ./cmd/migrate up

      - name: Verificar versão da migração aplicada
        working-directory: apps/api
        run: go run ./cmd/migrate version

      - name: Testar rollback reversível de migração (down)
        working-directory: apps/api
        run: go run ./cmd/migrate down

      - name: Reaplicar migrações para testes de integração (up)
        working-directory: apps/api
        run: go run ./cmd/migrate up

      - name: Executar testes de integração reais contra o PostgreSQL 18 (-race)
        working-directory: apps/api
        run: go test -race -v -coverprofile=coverage-integration.out ./internal/database/... ./internal/collector/...

      - name: Relatório de cobertura dos testes de integração
        working-directory: apps/api
        run: go tool cover -func=coverage-integration.out

      - name: Upload do artefato de cobertura de integração
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-coverage
          path: apps/api/coverage-integration.out
          retention-days: 7

  build:
    name: Build & Validação de Binários
    runs-on: ubuntu-latest
    needs: [lint-and-static-check, unit-tests, integration-tests]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'apps/api/go.mod'
          cache: true
          cache-dependency-path: 'apps/api/go.sum'

      - name: Compilar binário da API
        working-directory: apps/api
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -ldflags="-w -s" -o bin/api ./cmd/api

      - name: Compilar binário do CLI de Migração
        working-directory: apps/api
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -ldflags="-w -s" -o bin/migrate ./cmd/migrate

      - name: Validar compilação da imagem Docker de produção
        run: docker build -f deployments/Dockerfile -t radar-api:${{ github.sha }} .
